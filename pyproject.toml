[project]
name = "aeria-pipeline"
version = "1.0.0"
description = "Open-data air-quality ETL: LCSQA/Geod'air + Aeria IoT sensors -> cleaned PostgreSQL star warehouse with the French ATMO index"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
aeria-pipeline = "aeria_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aeria_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
